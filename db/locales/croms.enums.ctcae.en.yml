en:
  croms:
    adverse_event:
      ctcae:
        blood_and_lymphatic_system_disorders:
          title: "Blood and Lymphatic System Disorders"
          anemia:
            title: "Anemia"
            grade_1: "Hemoglobin (Hgb) <LLN - 10.0 g/dL; <LLN - 6.2 mmol/L; <LLN - 100 g/L"
            grade_2: "Hgb <10.0 - 8.0 g/dL; <6.2 - 4.9 mmol/L; <100 - 80g/L"
            grade_3: "Hgb <8.0 g/dL; <4.9 mmol/L; <80 g/L; transfusion indicated"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by a reduction in the amount of hemoglobin in 100 ml of blood. Signs and symptoms of anemia may include pallor of the skin and mucous membranes, shortness of breath, palpitations of the heart, soft systolic murmurs, lethargy, and fatigability."
          bone_marrow_hypocellular:
            title: "Bone marrow hypocellular"
            grade_1: "Mildly hypocellular or <=25% reduction from normal cellularity for age"
            grade_2: "Moderately hypocellular or >25 - <50% reduction from normal cellularity for age"
            grade_3: "Severely hypocellular or >50 - <=75% reduction cellularity from normal for age"
            grade_4: "Aplastic persistent for longer than 2 weeks"
            grade_5: "Death"
            definition: "A disorder characterized by the inability of the bone marrow to produce hematopoietic elements."
          disseminated_intravascular_coagulation:
            title: "Disseminated intravascular coagulation"
            grade_1: "Laboratory findings with no bleeding"
            grade_2: "Laboratory findings and bleeding"
            grade_3: "Life-threatening consequences; urgent intervention indicated"
            grade_4: "Death"
            grade_5: "—"
            definition: "A disorder characterized by systemic pathological activation of blood clotting mechanisms which results in clot formation throughout the body. There is an increase in the risk of hemorrhage as the body is depleted of platelets and coagulation factors."
          eosinophilia:
            title: "Eosinophilia"
            grade_1: ">ULN and >Baseline"
            grade_2: "Steroids initiated"
            grade_3: "—"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by laboratory test results that indicate an increased number of eosinophils in the blood."
          febrile_neutropenia:
            title: "Febrile neutropenia"
            grade_1: "—"
            grade_2: "—"
            grade_3: "ANC <1000/mm3 with a single temperature of >38.3 degrees C (101 degrees F) or a sustained temperature of >=38 degrees C (100.4 degrees F) for more than one hour"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by an ANC <1000/mm3 and a single temperature of >38.3 degrees C (101 degrees F) or a sustained temperature of >=38 degrees C (100.4 degrees F) for more than one hour."
          hemolysis:
            title: "Hemolysis"
            grade_1: "Laboratory evidence of hemolysis only (e.g., direct antiglobulin test; DAT; Coombs'; schistocytes; decreased haptoglobin)"
            grade_2: "Evidence of hemolysis and >=2 g decrease in hemoglobin"
            grade_3: "Transfusion or medical intervention indicated (e.g., steroids)"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by laboratory test results that indicate widespread erythrocyte cell membrane destruction."
          hemolytic_uremic_syndrome:
            title: "Hemolytic uremic syndrome"
            grade_1: "—"
            grade_2: "—"
            grade_3: "Laboratory findings with clinical consequences (e.g., renal insufficiency, petechiae)"
            grade_4: "Life-threatening consequences, (e.g., CNS hemorrhage or thrombosis/embolism or renal failure)"
            grade_5: "Death"
            definition: "A disorder characterized by a form of thrombotic microangiopathy with renal failure, hemolytic anemia, and severe thrombocytopenia."
          leukocytosis:
            title: "Leukocytosis"
            grade_1: "—"
            grade_2: "—"
            grade_3: ">100,000/mm3"
            grade_4: "Clinical manifestations of leucostasis; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by laboratory test results that indicate an increased number of white blood cells in the blood."
          lymph_node_pain:
            title: "Lymph node pain"
            grade_1: "Mild pain"
            grade_2: "Moderate pain; limiting instrumental ADL"
            grade_3: "Severe pain; limiting self care ADL"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by a sensation of marked discomfort in a lymph node."
          methemoglobinemia:
            title: "Methemoglobinemia"
            grade_1: "—"
            grade_2: ">ULN"
            grade_3: "Requiring urgent intervention"
            grade_4: "Life-threatening consequences"
            grade_5: "Death"
            definition: "A disorder characterized by laboratory test results that indicate increased methemoglobin in the blood."
          thrombotic_thrombocytopenic_purpura:
            title: "Thrombotic thrombocytopenic purpura"
            grade_1: "—"
            grade_2: "—"
            grade_3: "Laboratory findings with clinical consequences (e.g., renal insufficiency, petechiae)"
            grade_4: "Life-threatening consequences, (e.g., CNS hemorrhage or thrombosis/embolism or renal failure)"
            grade_5: "Death"
            definition: "A disorder characterized by the presence of microangiopathic hemolytic anemia, thrombocytopenic purpura, fever, renal abnormalities and neurological abnormalities such as seizures, hemiplegia, and visual disturbances. It is an acute or subacute condition."
          blood_and_lymphatic_system_disorders_other_specify:
            title: "Blood and lymphatic system disorders - Other, specify"
            grade_1: "Asymptomatic or mild symptoms; clinical or diagnostic observations only; intervention not indicated"
            grade_2: "Moderate; minimal, local or noninvasive intervention indicated; limiting age-appropriate instrumental ADL"
            grade_3: "Severe or medically significant but not immediately life-threatening; hospitalization or prolongation of existing hospitalization indicated; limiting self care ADL"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "—"

        cardiac_disorders:
          title: "Cardiac Disorders"
          aortic_valve_disease:
            title: "Aortic valve disease"
            grade_1: "Asymptomatic valvular thickening with or without mild valvular regurgitation or stenosis by imaging"
            grade_2: "Asymptomatic; moderate regurgitation or stenosis by imaging"
            grade_3: "Symptomatic; severe regurgitation or stenosis by imaging; symptoms controlled with medical intervention"
            grade_4: "Life-threatening consequences; urgent intervention indicated (e.g., valve replacement, valvuloplasty)"
            grade_5: "Death"
            definition: "A disorder characterized by a defect in aortic valve function or structure."
          asystole:
            title: "Asystole"
            grade_1: "Periods of asystole; non-urgent medical management indicated"
            grade_2: "—"
            grade_3: "—"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia without cardiac electrical activity. Typically, this is accompanied by cessation of the pumping function of the heart."
          atrial_fibrillation:
            title: "Atrial fibrillation"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Non-urgent medical intervention indicated"
            grade_3: "Symptomatic, urgent intervention indicated; device (e.g., pacemaker); ablation; new onset"
            grade_4: "Life-threatening consequences; embolus requiring urgent intervention"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia without discernible P waves and an irregular ventricular response due to multiple reentry circuits. The rhythm disturbance originates above the ventricles."
          atrial_flutter:
            title: "Atrial flutter"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Non-urgent medical intervention indicated"
            grade_3: "Symptomatic, urgent intervention indicated; device (e.g., pacemaker); ablation"
            grade_4: "Life-threatening consequences; embolus requiring urgent intervention"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia with organized rhythmic atrial contractions with a rate of 200-300 beats per minute. The rhythm disturbance originates in the atria."
          atrioventricular_block_complete:
            title: "Atrioventricular block complete"
            grade_1: "—"
            grade_2: "Non-urgent intervention indicated"
            grade_3: "Symptomatic and incompletely controlled medically, or controlled with device (e.g., pacemaker); new onset"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia with complete failure of atrial electrical impulse conduction through the AV node to the ventricles."
          atrioventricular_block_first_degree:
            title: "Atrioventricular block first degree"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Non-urgent intervention indicated"
            grade_3: "—"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by a dysrhythmia with a delay in the time required for the conduction of an electrical impulse through the atrioventricular (AV) node beyond 0.2 seconds; prolongation of the PR interval greater than 200 milliseconds."
          cardiac_arrest:
            title: "Cardiac arrest"
            grade_1: "—"
            grade_2: "—"
            grade_3: "—"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by cessation of the pumping function of the heart."
          chest_pain_cardiac:
            title: "Chest pain - cardiac"
            grade_1: "Mild pain"
            grade_2: "Moderate pain; pain on exertion; limiting instrumental ADL; hemodynamically stable"
            grade_3: "Pain at rest; limiting self care ADL; cardiac catheterization; new onset cardiac chest pain; unstable angina"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by substernal discomfort due to insufficient myocardial oxygenation e.g., angina pectoris."
          conduction_disorder:
            title: "Conduction disorder"
            grade_1: "Mild symptoms; intervention not indicated"
            grade_2: "Non-urgent medical intervention indicated"
            grade_3: "Symptomatic, urgent intervention indicated"
            grade_4: "Life-threatening consequences"
            grade_5: "Death"
            definition: "A disorder characterized by pathological irregularities in the cardiac conduction system."
          cyanosis:
            title: "Cyanosis"
            grade_1: "—"
            grade_2: "Present"
            grade_3: "—"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by a bluish discoloration of the skin and/or mucous membranes."
          heart_failure:
            title: "Heart failure"
            grade_1: "Asymptomatic with laboratory (e.g., BNP [B-Natriuretic Peptide ]) or cardiac imaging abnormalities"
            grade_2: "Symptoms with moderate activity or exertion"
            grade_3: "Symptoms at rest or with minimal activity or exertion; hospitalization; new onset of symptoms"
            grade_4: "Life-threatening consequences; urgent intervention indicated (e.g., continuous IV therapy or mechanical hemodynamic support)"
            grade_5: "Death"
            definition: "A disorder characterized by the inability of the heart to pump blood at an adequate volume to meet tissue metabolic requirements, or, the ability to do so only at an elevation in the filling pressure."
          left_ventricular_systolic_dysfunction:
            title: "Left ventricular systolic dysfunction"
            grade_1: "—"
            grade_2: "—"
            grade_3: "Symptomatic due to drop in ejection fraction responsive to intervention"
            grade_4: "Refractory or poorly controlled heart failure due to drop in ejection fraction; intervention such as ventricular assist device, intravenous vasopressor support, or heart transplant indicated"
            grade_5: "Death"
            definition: "A disorder characterized by failure of the left ventricle to produce adequate output."
          mitral_valve_disease:
            title: "Mitral valve disease"
            grade_1: "Asymptomatic valvular thickening with or without mild valvular regurgitation or stenosis by imaging"
            grade_2: "Asymptomatic; moderate regurgitation or stenosis by imaging"
            grade_3: "Symptomatic; severe regurgitation or stenosis by imaging; symptoms controlled with medical intervention"
            grade_4: "Life-threatening consequences; urgent intervention indicated (e.g., valve replacement, valvuloplasty)"
            grade_5: "Death"
            definition: "A disorder characterized by a defect in mitral valve function or structure."
          mobitz_type_ii_atrioventricular_block:
            title: "Mobitz (type) II atrioventricular block"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Symptomatic; medical intervention indicated"
            grade_3: "Symptomatic and incompletely controlled medically, or controlled with device (e.g., pacemaker); new onset"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia with relatively constant PR interval prior to the block of an atrial impulse. This is the result of intermittent failure of atrial electrical impulse conduction through the atrioventricular (AV) node to the ventricles."
          mobitz_type_i:
            title: "Mobitz type I"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Symptomatic; medical intervention indicated"
            grade_3: "Symptomatic and incompletely controlled medically, or controlled with device (e.g., pacemaker)"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia with a progressively lengthening PR interval prior to the blocking of an atrial impulse. This is the result of intermittent failure of atrial electrical impulse conduction through the atrioventricular (AV) node to the ventricles."
          myocardial_infarction:
            title: "Myocardial infarction"
            grade_1: "—"
            grade_2: "Asymptomatic and cardiac enzymes minimally abnormal and no evidence of ischemic ECG changes"
            grade_3: "Severe symptoms; cardiac enzymes abnormal; hemodynamically stable; ECG changes consistent with infarction"
            grade_4: "Life-threatening consequences; hemodynamically unstable"
            grade_5: "Death"
            definition: "A disorder characterized by gross necrosis of the myocardium; this is due to an interruption of blood supply to the area."
          myocarditis:
            title: "Myocarditis"
            grade_1: "—"
            grade_2: "Symptoms with moderate activity or exertion"
            grade_3: "Severe with symptoms at rest or with minimal activity or exertion; intervention indicated; new onset of symptoms"
            grade_4: "Life-threatening consequences; urgent intervention indicated (e.g., continuous IV therapy or mechanical hemodynamic support)"
            grade_5: "Death"
            definition: "A disorder characterized by inflammation of the muscle tissue of the heart."
          palpitations:
            title: "Palpitations"
            grade_1: "Mild symptoms; intervention not indicated"
            grade_2: "Intervention indicated"
            grade_3: "—"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by an unpleasant sensation of irregular and/or forceful beating of the heart."
          paroxysmal_atrial_tachycardia:
            title: "Paroxysmal atrial tachycardia"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Non-urgent medical intervention indicated"
            grade_3: "Symptomatic, urgent intervention indicated; ablation"
            grade_4: "Life-threatening consequences; incompletely controlled medically; cardioversion indicated"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia with abrupt onset and sudden termination of atrial contractions with a rate of 150-250 beats per minute. The rhythm disturbance originates in the atria."
          pericardial_effusion:
            title: "Pericardial effusion"
            grade_1: "—"
            grade_2: "Asymptomatic effusion size small to moderate"
            grade_3: "Effusion with physiologic consequences"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by fluid collection within the pericardial sac, usually due to inflammation."
          pericardial_tamponade:
            title: "Pericardial tamponade"
            grade_1: "—"
            grade_2: "—"
            grade_3: "—"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by an increase in intrapericardial pressure due to the collection of blood or fluid in the pericardium."
          pericarditis:
            title: "Pericarditis"
            grade_1: "Asymptomatic, ECG or physical findings (e.g., rub) consistent with pericarditis"
            grade_2: "Symptomatic pericarditis (e.g., chest pain)"
            grade_3: "Pericarditis with physiologic consequences (e.g., pericardial constriction)"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by irritation to the layers of the pericardium (the protective sac around the heart)."
          pulmonary_valve_disease:
            title: "Pulmonary valve disease"
            grade_1: "Asymptomatic valvular thickening with or without mild valvular regurgitation or stenosis by imaging"
            grade_2: "Asymptomatic; moderate regurgitation or stenosis by imaging"
            grade_3: "Symptomatic; severe regurgitation or stenosis by imaging; symptoms controlled with medical intervention"
            grade_4: "Life-threatening consequences; urgent intervention indicated (e.g., valve replacement, valvuloplasty)"
            grade_5: "Death"
            definition: "A disorder characterized by a defect in pulmonary valve function or structure."
          restrictive_cardiomyopathy:
            title: "Restrictive cardiomyopathy"
            grade_1: "Imaging findings only"
            grade_2: "Symptomatic without signs of heart failure"
            grade_3: "Symptomatic heart failure or other cardiac symptoms, responsive to intervention; new onset of symptoms"
            grade_4: "Refractory heart failure or other poorly controlled cardiac symptoms"
            grade_5: "Death"
            definition: "A disorder characterized by an inability of the ventricles to fill with blood because the myocardium (heart muscle) stiffens and loses its flexibility."
          right_ventricular_dysfunction:
            title: "Right ventricular dysfunction"
            grade_1: "Asymptomatic with laboratory (e.g., BNP [B-Natriuretic Peptide ]) or cardiac imaging abnormalities"
            grade_2: "Symptoms with moderate activity or exertion"
            grade_3: "Severe symptoms, associated with hypoxia, right heart failure; oxygen indicated"
            grade_4: "Life-threatening consequences; urgent intervention indicated (e.g., ventricular assist device); heart transplant indicated"
            grade_5: "Death"
            definition: "A disorder characterized by impairment of right ventricular function associated with low ejection fraction and a decrease in motility of the right ventricular wall."
          sick_sinus_syndrome:
            title: "Sick sinus syndrome"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Symptomatic, intervention not indicated; change in medication initiated"
            grade_3: "Symptomatic, intervention indicated"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia with alternating periods of bradycardia and atrial tachycardia accompanied by syncope, fatigue and dizziness."
          sinus_bradycardia:
            title: "Sinus bradycardia"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Symptomatic, intervention not indicated; change in medication initiated"
            grade_3: "Symptomatic, intervention indicated"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia with a heart rate less than 60 beats per minute that originates in the sinus node."
          sinus_tachycardia:
            title: "Sinus tachycardia"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Symptomatic; non-urgent medical intervention indicated"
            grade_3: "Urgent medical intervention indicated"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by a dysrhythmia with a heart rate greater than 100 beats per minute that originates in the sinus node."
          supraventricular_tachycardia:
            title: "Supraventricular tachycardia"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Non-urgent medical intervention indicated"
            grade_3: "Symptomatic, urgent intervention indicated"
            grade_4: "Life-threatening consequences"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia with a heart rate greater than 100 beats per minute that originates above the ventricles."
          tricuspid_valve_disease:
            title: "Tricuspid valve disease"
            grade_1: "Asymptomatic valvular thickening with or without mild valvular regurgitation or stenosis"
            grade_2: "Asymptomatic; moderate regurgitation or stenosis by imaging"
            grade_3: "Symptomatic; severe regurgitation or stenosis; symptoms controlled with medical intervention"
            grade_4: "Life-threatening consequences; urgent intervention indicated (e.g., valve replacement, valvuloplasty)"
            grade_5: "Death"
            definition: "A disorder characterized by a defect in tricuspid valve function or structure."
          ventricular_arrhythmia:
            title: "Ventricular arrhythmia"
            grade_1: "Asymptomatic, intervention not indicated"
            grade_2: "Non-urgent medical intervention indicated"
            grade_3: "Urgent intervention indicated"
            grade_4: "Life-threatening consequences; hemodynamic compromise"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia that originates in the ventricles."
          ventricular_fibrillation:
            title: "Ventricular fibrillation"
            grade_1: "—"
            grade_2: "—"
            grade_3: "—"
            grade_4: "Life-threatening consequences; hemodynamic compromise"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia without discernible QRS complexes due to rapid repetitive excitation of myocardial fibers without coordinated contraction of the ventricles."
          ventricular_tachycardia:
            title: "Ventricular tachycardia"
            grade_1: "—"
            grade_2: "Non-urgent medical intervention indicated"
            grade_3: "Symptomatic, urgent intervention indicated"
            grade_4: "Life-threatening consequences; hemodynamic compromise"
            grade_5: "Death"
            definition: "A disorder characterized by a dysrhythmia with a heart rate greater than 100 beats per minute that originates distal to the bundle of His."
          cardiac_disorders_other_specify:
            title: "Cardiac disorders - Other, specify"
            grade_1: "Asymptomatic or mild symptoms; clinical or diagnostic observations only; intervention not indicated"
            grade_2: "Moderate; minimal, local or noninvasive intervention indicated; limiting age-appropriate instrumental ADL"
            grade_3: "Severe or medically significant but not immediately life-threatening; hospitalization or prolongation of existing hospitalization indicated; limiting self care ADL"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "—"

        congenital_familial_and_genetic_disorders:
          title: "Congenital, Familial and Genetic Disorders"
          congenital_familial_and_genetic_disorders_other_specify:
            title: "Congenital, familial and genetic disorders - Other, specify"
            grade_1: "Asymptomatic or mild symptoms; clinical or diagnostic observations only; intervention not indicated"
            grade_2: "Moderate; minimal, local or noninvasive intervention indicated; limiting age-appropriate instrumental ADL"
            grade_3: "Severe or medically significant but not immediately life-threatening; hospitalization or prolongation of existing hospitalization indicated; limiting self care ADL"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "—"

        ear_and_labyrinth_disorders:
          title: "Ear and labyrinth disorders"
          ear_pain:
            title: "Ear pain"
            grade_1: "Mild pain"
            grade_2: "Moderate pain; limiting instrumental ADL"
            grade_3: "Severe pain; limiting self care ADL"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by a sensation of marked discomfort in the ear."
          external_ear_pain:
            title: "External ear pain"
            grade_1: "Mild pain"
            grade_2: "Moderate pain; limiting instrumental ADL"
            grade_3: "Severe pain; limiting self care ADL"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by a sensation of marked discomfort in the external ear region."
          hearing_impaired:
            title: "Hearing impaired"
            grade_1: "Adults enrolled on a Monitoring Program (on a 1, 2, 4, 3, 6, and 8 kHz audiogram): Threshold shift of 15 - 25 dB averaged at 2 contiguous test frequencies in at least one ear; Adults not enrolled on a Monitoring Program: Subjective change in hearing in the absence of documented hearing loss; Pediatric (on a 1, 2, 3, 4, 6, and 8 kHz audiogram): Threshold shift >20 dB hearing loss (HL) (i.e., 25 dB HL or greater); sensorineural hearing loss (SNHL) above 4 kHz (i.e., 6 or 8 kHz) in at least one ear"
            grade_2: "Adults enrolled on a Monitoring Program (on a 1, 2, 3, 4, 6, and 8 kHz audiogram): Threshold shift of >25 dB averaged at 2 contiguous test frequencies in at least one ear; Adults not enrolled on a Monitoring Program: Hearing loss with hearing aid or intervention not indicated; limiting instrumental ADL; Pediatric (on a 1, 2, 3, 4, 6, and 8 kHz audiogram): Threshold shift >20 dB at 4 kHz in at least one ear"
            grade_3: "Adults enrolled on a Monitoring Program (on a 1, 2, 3, 4, 6, and 8 kHz audiogram): Threshold shift of >25 dB averaged at 3 contiguous test frequencies in at least one ear; therapeutic intervention indicated; Adults not enrolled on a Monitoring Program: Hearing loss with hearing aid or intervention indicated; limiting self care ADL; Pediatric (on a 1, 2, 3, 4, 6, and 8 kHz audiogram): Hearing loss sufficient to indicate therapeutic intervention, including hearing aids; threshold shift >20 dB at 2 to < 4 kHz in at least one ear"
            grade_4: "Adults: Decrease in hearing to profound bilateral loss (absolute threshold >80 dB HL at 2 kHz and above); nonservicable hearing; Pediatric: Audiologic indication for cochlear implant; > 40 dB HL (i.e., 45 dB HL or more); SNHL at 2 kHz and above"
            grade_5: "—"
            definition: "A disorder characterized by partial or complete loss of the ability to detect or understand sounds resulting from damage to ear structures."
          middle_ear_inflammation:
            title: "Middle ear inflammation"
            grade_1: "Serous otitis"
            grade_2: "Serous otitis, medical intervention indicated"
            grade_3: "Mastoiditis; necrosis of canal soft tissue or bone"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "A disorder characterized by inflammation (physiologic response to irritation), swelling and redness to the middle ear."
          tinnitus:
            title: "Tinnitus"
            grade_1: "Mild symptoms; intervention not indicated"
            grade_2: "Moderate symptoms; limiting instrumental ADL"
            grade_3: "Severe symptoms; limiting self care ADL"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by noise in the ears, such as ringing, buzzing, roaring or clicking."
          vertigo:
            title: "Vertigo"
            grade_1: "Mild symptoms"
            grade_2: "Moderate symptoms; limiting instrumental ADL"
            grade_3: "Severe symptoms; limiting self care ADL"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by a sensation as if the external world were revolving around the patient (objective vertigo) or as if he himself were revolving in space (subjective vertigo)."
          vestibular_disorder:
            title: "Vestibular disorder"
            grade_1: "—"
            grade_2: "Symptomatic; limiting instrumental ADL"
            grade_3: "Severe symptoms; limiting self care ADL"
            grade_4: "—"
            grade_5: "—"
            definition: "A disorder characterized by dizziness, imbalance, nausea, and vision problems."
          ear_and_labyrinth_disorders_other_specify:
            title: "Ear and labyrinth disorders - Other, specify"
            grade_1: "Asymptomatic or mild symptoms; clinical or diagnostic observations only; intervention not indicated"
            grade_2: "Moderate; minimal, local or noninvasive intervention indicated; limiting age-appropriate instrumental ADL"
            grade_3: "Severe or medically significant but not immediately life-threatening; hospitalization or prolongation of existing hospitalization indicated; limiting self care ADL"
            grade_4: "Life-threatening consequences; urgent intervention indicated"
            grade_5: "Death"
            definition: "—"

        endocrine_disorders:
          title: "Endocrine disorders"
          adrenal_insufficiency:
            title: "Adrenal insufficiency"
            grade_1: "Asymptomatic; clinical or diagnostic observations only; intervention not indicated"
            grade_2: "Moderate symptoms; medical intervention indicated"
            grade_3: "Severe symptoms; hospitalization indicated"
